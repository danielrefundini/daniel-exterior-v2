<!doctype html>
<!--
  Source of public/og/daniel-exteriors-og.png (1200 x 630 social card).
  The mark is src/app/apple-icon.png used as is, at its native 180 x 180 size.
  To re-render: see "Social image" in README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #112b39; color: #f2f5f6; font-family: "DM Sans", sans-serif; font-style: normal; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px 56px; display: flex; flex-direction: column; position: relative; }
  .top { display: flex; align-items: center; gap: 28px; }
  .mark { width: 180px; height: 180px; border-radius: 28px; display: block; }
  .brand { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; }
  .who { margin-top: 6px; font-size: 22px; color: rgba(242, 245, 246, .78); }
  h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 62px; line-height: 1.06; letter-spacing: -0.02em; margin: 44px 0 0; max-width: 1000px; }
  h1 span { color: #dfb878; }
  .bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .sub { font-size: 26px; color: rgba(242, 245, 246, .86); max-width: 760px; line-height: 1.35; }
  .url { font-weight: 700; font-size: 24px; color: #dfb878; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #dfb878; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img class="mark" src="../src/app/apple-icon.png" alt="">
      <div>
        <div class="brand">Daniel Exteriors</div>
        <div class="who">Daniel Refundini, Remodeling Consultant at Presidential Exteriors</div>
      </div>
    </div>
    <h1>Windows, roofing, siding and doors <span>in the DMV.</span></h1>
    <div class="bottom">
      <div class="sub">Free exterior inspection and estimate in Maryland, Washington, DC and Northern Virginia.</div>
      <div class="url">danielrefundini.com</div>
    </div>
    <div class="rule"></div>
  </div>
</body>
</html>
